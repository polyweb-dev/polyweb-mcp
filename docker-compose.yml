services:
  freesearch:
    build:
      context: .
      dockerfile: Dockerfile
    image: freesearch:latest
    container_name: freesearch
    restart: unless-stopped
    ports:
      - "8001:8001"   # Web UI and REST API
      - "8000:8000"   # FastMCP Streamable-HTTP Server
    volumes:
      - freesearch_data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - FREESEARCH_HOST=0.0.0.0
      - FREESEARCH_API_PORT=8001
      - FREESEARCH_MCP_PORT=8000
      - FREESEARCH_DATA_DIR=/data
      - FREESEARCH_DB=/data/freesearch.db
      - FREESEARCH_SECRET_STORE=database
      # Master encryption key (optional; auto-generated into /data/.secret_key if not provided)
      # - FREESEARCH_ENCRYPTION_KEY=your-encryption-key-or-passphrase
      # Provider API keys (optional; if set here or in .env, overrides keys stored in the database)
      # - FREESEARCH_BRAVE_SEARCH_API_KEY=
      # - FREESEARCH_TAVILY_API_KEY=
      # - FREESEARCH_EXA_API_KEY=
      # - FREESEARCH_FIRECRAWL_API_KEY=
      # - FREESEARCH_YOU_API_KEY=
      # - FREESEARCH_PARALLEL_API_KEY=
      # - FREESEARCH_KEENABLE_API_KEY=

volumes:
  freesearch_data:
    name: freesearch_data
