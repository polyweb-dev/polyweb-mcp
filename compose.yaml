# Polyweb homelab / LAN stack.
#
# Usage (from the repo root):
#   cp .env.example .env      # non-secret runtime settings (optional)
#   docker compose up --build # dashboard :3000, API :8001, MCP :8000
#
# What you get:
#   http://<host>:3000       dashboard (nginx, Docker-only; local dev uses pnpm dev)
#   http://<host>:8001/docs  REST API + Swagger
#   http://<host>:8000/mcp   MCP (streamable HTTP) for coding agents:
#     { "type": "streamable-http", "url": "http://<host>:8000/mcp" }
#
# STDIO note: stdio MCP requires the client to spawn the server process, so it
# cannot be served over the network. Inside Docker it is a local-only escape
# hatch on the same machine that runs the daemon, e.g.:
#   docker compose exec -T mcp uv run --no-sync polyweb-mcp --transport stdio
# For every LAN / remote agent, use the streamable-http URL above.
#
# State: api + mcp share one SQLite DB and one master-key file on the
# `polyweb-data` volume. Single-node only — do not scale replicas without
# moving off SQLite. Provider keys are never in this file; store them in the
# encrypted vault via the dashboard (http://<host>:3000).

name: polyweb

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: ${COMPOSE_PROJECT_NAME:-polyweb}-backend:latest
    restart: unless-stopped
    ports:
      - "${API_PORT:-8001}:8001"
    env_file:
      - path: .env
        required: false
    environment:
      POLYWEB_DB: /data/polyweb.db
      POLYWEB_ENCRYPTION_KEY_FILE: /data/.secret_key
    volumes:
      - polyweb-data:/data
    healthcheck:
      test: [
        "CMD-SHELL",
        "uv run --no-sync python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)\"",
      ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: ${COMPOSE_PROJECT_NAME:-polyweb}-backend:latest
    restart: unless-stopped
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "polyweb-mcp",
        "--transport",
        "streamable-http",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "${MCP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      POLYWEB_DB: /data/polyweb.db
      POLYWEB_ENCRYPTION_KEY_FILE: /data/.secret_key
      # Uncomment for stateless mode behind a proxy / multiple replicas:
      # POLYWEB_MCP_STATELESS: "true"
    volumes:
      - polyweb-data:/data

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    image: ${COMPOSE_PROJECT_NAME:-polyweb}-ui:latest
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  polyweb-data:
