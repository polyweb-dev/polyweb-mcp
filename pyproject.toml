[project]
name = "polyweb"
version = "0.1.0"
description = "Provider-neutral search and fetch contracts for Polyweb."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSING.md", "CONTRIBUTORS.md", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.14,<2.0",
    "cryptography>=44,<51",
    "exa-py>=2.18.1,<3",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5,<16",
    "firecrawl-py>=4.0,<5.0",
    "httpx>=0.27,<0.29",
    "mcp>=1.0,<2.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "tavily-python>=0.7.27,<0.8",
]

[project.scripts]
polyweb-api = "polyweb.routers.api:main"
polyweb-db = "polyweb.persistence.database_cli:main"
polyweb-mcp = "polyweb.mcp.server:main"
polyweb-users = "polyweb.cli.users:main"
polyweb-secrets = "polyweb.cli.secrets:main"

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "mypy>=1.10,<2.0",
    "pyinstrument>=5.1.3,<6",
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-gremlins>=1.9.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.5,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyweb"]

[tool.hatch.build.targets.sdist]
# Keep bundled skills, local tool caches, and frontend dependencies out of PyPI artifacts.
only-include = [
    "src",
    "tests",
    "alembic.ini",
    "pyproject.toml",
    "uv.lock",
    "README.md",
    "LICENSE",
    "NOTICE",
    "LICENSING.md",
    "CONTRIBUTORS.md",
    "THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Runtime-only debris from the constrained-sandbox BDD runs (scenario working
# directories that the harness cannot list or delete); never source code.
extend-exclude = ["polyweb-control-cwd-*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (unused imports, variables, undefined names)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modern Python 3.12+ idioms)
    "B",    # flake8-bugbear (bug patterns & reliability)
    "SIM",  # flake8-simplify (simplifying code structures)
    "TID",  # flake8-tidy-imports (import boundaries and clean imports)
    "RUF",  # Ruff-specific static analysis rules
    "C90",  # mccabe cyclomatic complexity
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"src/polyweb/infrastructure/resilience.py" = ["C901"]  # _self_check smoke test contains complex state verification
"tests/**" = ["C901"]                     # Tests have lengthy setups, parameter matrices, and extensive assertions

[tool.behave]
paths = ["tests/bdd/features"]
# @live scenarios call real providers: they run only when selected explicitly
# with --tags (e.g. --tags="@live and @latency"), which replaces this default.
default_tags = ["not @live"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["polyweb"]
mypy_path = ["src"]
