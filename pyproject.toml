[project]
name = "freesearch"
version = "0.1.0"
description = "Provider-neutral search and fetch contracts for FreeSearch."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.14,<2.0",
    "cryptography>=44,<51",
    "exa-py>=2.18.1,<3",
    "fastapi>=0.141.1",
    "firecrawl-py>=4.0,<5.0",
    "httpx>=0.27,<0.29",
    "mcp>=1.0,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "tavily-python>=0.7.27,<0.8",
]

[project.scripts]
freesearch-api = "freesearch.routers.api:main"
freesearch-db = "freesearch.persistence.database_cli:main"
freesearch-mcp = "freesearch.mcp.server:main"

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "mypy>=1.10,<2.0",
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-gremlins>=1.9.0",
    "ruff>=0.5,<1.0",
]

[build-system]
requires = ["hatchling>=1.24,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freesearch"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Runtime-only debris from the constrained-sandbox BDD runs (scenario working
# directories that the harness cannot list or delete); never source code.
extend-exclude = ["freesearch-control-cwd-*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (unused imports, variables, undefined names)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modern Python 3.12+ idioms)
    "B",    # flake8-bugbear (bug patterns & reliability)
    "SIM",  # flake8-simplify (simplifying code structures)
    "TID",  # flake8-tidy-imports (import boundaries and clean imports)
    "RUF",  # Ruff-specific static analysis rules
    "C90",  # mccabe cyclomatic complexity
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"src/freesearch/infrastructure/resilience.py" = ["C901"]  # _self_check smoke test contains complex state verification
"tests/**" = ["C901"]                     # Tests have lengthy setups, parameter matrices, and extensive assertions

[tool.behave]
paths = ["tests/bdd/features"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["freesearch"]
mypy_path = ["src"]
