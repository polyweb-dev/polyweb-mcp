labels:
  size: standard
  provider: gcp

when:
  - event: manual

steps:
  integration-tests:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    environment:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    commands:
      - |
        echo "=========================================================="
        echo "               GCP SPOT CI WORKER INFO                    "
        echo "=========================================================="
        echo "Worker Host:   ${CI_MACHINE}"
        echo "Worker Labels: ${CI_AGENT_LABELS}"
        echo "OS / Platform: ${CI_SYSTEM_PLATFORM}"
        echo "CPU Cores:     $(nproc) physical/virtual cores detected"
        echo "Total Memory:  $(free -h | awk "/Mem:/ {print \$2}")"
        echo "Free Disk:     $(df -h / | awk "NR==2 {print \$4}")"
        echo "=========================================================="
      - |
        bash scripts/ci/run-and-log.sh integration-tests.log bash -euo pipefail -c '
          # Finite bounds. The repository timeout did not stop a 116 minute stall.
          # GNU timeout signals its whole process group, so xdist workers and uv
          # children stop too. SIGABRT makes faulthandler print every thread stack
          # into this log; -k then force-kills what survives. Exit 124 means timeout.
          command -v timeout >/dev/null || { echo "GNU timeout is required"; exit 127; }
          export PYTHONFAULTHANDLER=1
          test -f .env || cp .env.example .env
          uv sync --frozen
          timeout -s ABRT -k 30 180 uv run polyweb-db upgrade || { echo "polyweb-db upgrade failed or hit its 180 s bound (exit status $?)"; exit 1; }
          timeout -s ABRT -k 60 1200 uv run pytest tests/integration --ignore=tests/integration/latency -n auto -q || { echo "pytest failed or hit its 1200 s bound (exit status $?)"; exit 1; }
        '

  upload-artifacts:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    environment:
      GITEA_UPLOAD_TOKEN:
        from_secret: gitea_artifact_upload_token
    commands:
      - python scripts/ci/upload_gitea.py api-integration
    when:
      - event: manual
        status: [success, failure]
