# Docker-only nginx config for the Polyweb dashboard (`ui` service).
# Local development never uses this file — `pnpm dev` proxies to the backend
# via polyweb-ui/vite.config.ts instead.
#
# Same-origin strategy: the UI was built with VITE_API_URL empty, so every
# backend call is a relative path. nginx serves the SPA and reverse-proxies
# the backend paths to the `api` service.

upstream polyweb_api {
    server api:8001;
}

server {
    listen 80;
    server_name _;

    # --- Backend API (must come before the SPA fallback) -------------------
    # REST + control plane + monitoring snapshot.
    location /api/ {
        proxy_pass http://polyweb_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /search {
        proxy_pass http://polyweb_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /fetch {
        proxy_pass http://polyweb_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /stats {
        proxy_pass http://polyweb_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /dashboard {
        proxy_pass http://polyweb_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Swagger / ReDoc / OpenAPI schema (convenience; also reachable on :8001).
    location = /docs {
        proxy_pass http://polyweb_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /redoc {
        proxy_pass http://polyweb_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /openapi.json {
        proxy_pass http://polyweb_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- React SPA ----------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        # react-router fallback: unknown paths serve index.html.
        try_files $uri $uri/ /index.html;
    }
}
