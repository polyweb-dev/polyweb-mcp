name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "polyweb-docs/**"
      - "scripts/copy-license-files.mjs"
      - "LICENSE"
      - "NOTICE"
      - "LICENSING.md"
      - "CONTRIBUTORS.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: polyweb-docs/pnpm-lock.yaml
      - name: Install
        working-directory: polyweb-docs
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: polyweb-docs
        run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: polyweb-docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
